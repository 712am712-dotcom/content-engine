[phases.setup]
nixPkgs = ["nodejs_20", "ffmpeg"]
cmds = [
  "apt-get update -qq && apt-get install -y --no-install-recommends libnspr4 libnss3 libgbm1 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libxcomposite1 libxdamage1 libxrandr2 libasound2 libxss1 libgtk-3-0 && rm -rf /var/lib/apt/lists/*"
]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"
