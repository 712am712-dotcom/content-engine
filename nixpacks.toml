[phases.setup]
# Chrome headless shell runtime deps (Remotion downloads its own Chrome binary)
aptPkgs = [
  "libnspr4",
  "libnss3",
  "libgbm-dev",
  "libdbus-1-3",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libxcomposite1",
  "libxdamage1",
  "libxrandr2",
  "libgbm1",
  "libasound2",
  "libxss1",
  "libgtk-3-0",
  "ffmpeg"
]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"
